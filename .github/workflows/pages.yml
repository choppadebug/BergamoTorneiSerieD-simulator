name: Refresh standings and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - name: Fetch current public standings and calendars
        run: python live_fetch.py --output data/live.json --allow-stale
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html styles.css app.js live.js worker.js live-config.json .nojekyll _site/
          cp league_simulator.py historical_calibration.py web_runner.py live_standings.py live_projection.py _site/
          cp -r input data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
